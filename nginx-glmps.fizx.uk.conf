# /etc/nginx/sites-available/glmps.fizx.uk
#
# Only fizx subdomain that needs SPA fallback (`try_files $uri $uri/ /index.html`)
# because glmps uses /r/<naddr> deep links for client-side routes.
#
# Install (after the cert SAN includes glmps.fizx.uk — see server-bootstrap-glmps.sh):
#   scp -P 2121 nginx-glmps.fizx.uk.conf root@88.218.206.187:/etc/nginx/sites-available/glmps.fizx.uk
#   ssh -p 2121 root@88.218.206.187 'ln -sf /etc/nginx/sites-available/glmps.fizx.uk /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glmps.fizx.uk;

    root /var/www/glmps.fizx.uk;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/pls.fizx.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pls.fizx.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cache hashed assets aggressively; index.html stays fresh
    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|webp|avif)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name glmps.fizx.uk;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
